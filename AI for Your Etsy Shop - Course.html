document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lick=\"{{ lo.onSelect }}\" style=\"{{ lo.style }}\">{{ lo.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fheader>\n\n  <div style=\"display:flex; flex:1; max-width:1200px; margin:0 auto; width:100%;\">\n\n    <nav style=\"width:300px; flex-shrink:0; padding:32px 20px; border-right:1px solid #E5E0D8; display:flex; flex-direction:column; gap:4px; justify-content:space-between;\">\n      <div style=\"display:flex; flex-direction:column; gap:4px;\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:16px;\">\n          <div style=\"font-size:13px; color:#737373; flex-shrink:0;\">{{ completedCount }} / {{ totalLessons }} lessen<\u002Fdiv>\n          <div style=\"flex:1; height:6px; background:#eee9de; overflow:hidden;\">\n            <div style=\"{{ progressBarStyle }}\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ sidebarLessons }}\" as=\"item\" hint-placeholder-count=\"8\">\n          <button sc-camel-on-click=\"{{ item.onSelect }}\" style=\"{{ item.rowStyle }}\">\n            <sc-if value=\"{{ item.done }}\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" style=\"flex-shrink:0;\"><path d=\"M2 8 L6 12 L14 3\" stroke=\"#5c7a12\" stroke-width=\"2\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ item.locked }}\">\n              <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" style=\"flex-shrink:0;\"><rect x=\"3\" y=\"7\" width=\"10\" height=\"7\" fill=\"none\" stroke=\"#737373\" stroke-width=\"1.5\"><\u002Frect><path d=\"M5 7 V5 a3 3 0 0 1 6 0 V7\" fill=\"none\" stroke=\"#737373\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ item.showNumber }}\">\n              <div style=\"width:14px; font-size:12px; color:#737373; flex-shrink:0;\">{{ item.numberLabel }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"{{ item.titleStyle }}\">{{ item.title }}<\u002Fdiv>\n            <sc-if value=\"{{ item.isPro }}\">\n              <div style=\"margin-left:auto; font-size:10px; font-weight:700; color:#274ec9; background:#e8ecfa; padding:2px 6px; flex-shrink:0;\">PRO<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; flex-direction:column; gap:8px; padding-top:16px; border-top:1px solid #E5E0D8;\">\n        <sc-if value=\"{{ authLoggedOut }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex; align-items:center; gap:6px; flex-wrap:wrap;\">\n            <sc-if value=\"{{ magicLinkSent }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:11.5px; color:#5c7a12;\">Check je mail voor de link.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ magicLinkNotSent }}\" hint-placeholder-val=\"{{ true }}\">\n              <input type=\"email\" value=\"{{ authEmail }}\" sc-camel-on-change=\"{{ onAuthEmailChange }}\" placeholder=\"jij@email.com\" style=\"border:1px solid #E5E0D8; padding:5px 8px; font-size:11.5px; width:120px;\">\n              <button sc-camel-on-click=\"{{ onSendMagicLink }}\" style=\"background:#0A0A0A; color:#F5F1EA; font-size:11px; font-weight:600; padding:6px 9px;\">Voortgang bewaren<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ authLoggedIn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; align-items:center; gap:6px; font-size:11.5px; color:#737373;\">\n            <div>{{ authEmail }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onSignOut }}\" style=\"background:transparent; color:#737373; text-decoration:underline; font-size:11px; padding:0;\">Uitloggen<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; align-items:center; gap:10px; padding-top:20px; border-top:1px solid #E5E0D8;\">\n        <img src=\"{{ companionIconSrc }}\" alt=\"Coco\" style=\"width:{{ companionSize }}px; height:{{ companionSize }}px; object-fit:contain; transition:width 0.3s, height 0.3s;\">\n      <\u002Fdiv>\n    <\u002Fnav>\n\n    <main style=\"flex:1; padding:48px 56px 100px; max-width:680px;\">\n\n      <sc-if value=\"{{ showGate }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:12px; font-weight:600; color:#274ec9; margin-bottom:10px;\">Starter path complete<\u002Fdiv>\n          <h1 style=\"font-family:'DM Sans',sans-serif; font-weight:700; font-size:30px; margin:0 0 20px;\">You've finished the free path.<\u002Fh1>\n          <div style=\"border:1px solid #E5E0D8; background:#fff; padding:28px; margin-bottom:28px; display:flex; flex-direction:column; gap:8px;\">\n            <div style=\"font-size:13px; color:#737373;\">Your pace<\u002Fdiv>\n            <div style=\"font-size:15px;\">{{ gateStats }}<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:16px; line-height:1.75; color:#0A0A0A; opacity:0.85;\">{{ gateMessage }}<\u002Fp>\n          <div style=\"border:1px solid #E5E0D8; background:#fff; padding:28px; margin:28px 0; display:flex; flex-direction:column; gap:12px;\">\n            <div style=\"display:flex; align-items:center; gap:10px;\">\n              <div style=\"font-family:'DM Sans',sans-serif; font-weight:700; font-size:19px;\">Pro: Automatic order thank-you<\u002Fdiv>\n              <div style=\"font-size:11px; font-weight:700; color:#274ec9; background:#e8ecfa; padding:2px 6px;\">PRO<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:14.5px; line-height:1.6; color:#0A0A0A;\">The moment an order comes in, a warm thank-you email drafts itself, with a review request timed a week later — you just approve and send. Under $5/month in OpenAI API usage.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:12px;\">\n            <button sc-camel-on-click=\"{{ passGate }}\" style=\"background:#C9A227; color:#0A0A0A; font-family:'DM Sans',sans-serif; font-weight:700; font-size:15px; padding:14px 24px;\">Unlock Pro: Step 3<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ skipToBonus }}\" style=\"background:transparent; color:#0A0A0A; border:1.5px solid #0A0A0A; font-family:'DM Sans',sans-serif; font-weight:700; font-size:15px; padding:12.5px 24px;\">Stay on Starter, skip ahead<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showLesson }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#C9A227; margin-bottom:6px;\">AI for Your Etsy Shop<\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:10px;\">\n            <div style=\"font-size:11px; font-weight:600; color:#737373;\">{{ activeLesson.kicker }}<\u002Fdiv>\n            <sc-if value=\"{{ activeLesson.isPro }}\">\n              <div style=\"font-size:10px; font-weight:700; color:#274ec9; background:#e8ecfa; padding:2px 6px;\">PRO<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <h1 style=\"font-family:'DM Sans',sans-serif; font-weight:700; font-size:30px; margin:0 0 28px;\">{{ activeLesson.title }}<\u002Fh1>\n\n          <sc-for list=\"{{ activeBlocks }}\" as=\"block\" hint-placeholder-count=\"4\">\n            <div style=\"margin-bottom:24px;\">\n              <sc-if value=\"{{ block.isP }}\">\n                <p style=\"font-size:16px; line-height:1.7; color:#0A0A0A; margin:0;\">{{ block.text }}<\u002Fp>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ block.isList }}\">\n                <div style=\"display:flex; flex-direction:column; gap:10px;\">\n                  <sc-for list=\"{{ block.items }}\" as=\"li\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex; gap:10px; font-size:15px; line-height:1.6;\">\n                      <div style=\"color:#C9A227; flex-shrink:0;\">▸<\u002Fdiv><div>{{ li }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ block.isChecklist }}\">\n                <div style=\"display:flex; flex-direction:column; gap:10px; border:1px solid #E5E0D8; background:#fff; padding:20px;\">\n                  <sc-for list=\"{{ block.items }}\" as=\"li\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex; gap:10px; font-size:15px; line-height:1.5;\">\n                      <div style=\"width:14px; height:14px; border:1.5px solid #737373; flex-shrink:0; margin-top:2px;\"><\u002Fdiv><div>{{ li }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ block.isPrompt }}\">\n                <div style=\"border:1px solid #E5E0D8; background:#0A0A0A; color:#F5F1EA; padding:18px 20px; font-family:'Source Code Pro',monospace; font-size:13.5px; line-height:1.6; white-space:pre-wrap;\">{{ block.text }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ block.isQa }}\">\n                <div style=\"display:flex; flex-direction:column; gap:6px;\">\n                  <div style=\"font-weight:700; font-size:15px;\">{{ block.q }}<\u002Fdiv>\n                  <div style=\"font-size:14.5px; line-height:1.6; color:#0A0A0A;\">{{ block.a }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"margin-top:36px; display:flex; gap:12px;\">\n            <button sc-camel-on-click=\"{{ completeLesson }}\" style=\"background:#C9A227; color:#0A0A0A; font-family:'DM Sans',sans-serif; font-weight:700; font-size:15px; padding:14px 24px;\">{{ nextLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showUpsell }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border:1px solid #E5E0D8; background:#fff; padding:32px; margin-top:40px; display:flex; flex-direction:column; gap:12px;\">\n          <div style=\"font-size:12px; font-weight:600; color:#274ec9;\">Course complete<\u002Fdiv>\n          <div style=\"font-family:'DM Sans',sans-serif; font-weight:700; font-size:22px;\">{{ upsellHeadline }}<\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.65; color:#0A0A0A; opacity:0.8; margin:0;\">You finished in {{ elapsedMin }} minutes. If the listing prompts are already saving you time, the order follow-up automation is there whenever you're curious — done together, at your pace.<\u002Fp>\n          <a href=\"mailto:hello@getbuiltagain.com\" style=\"display:inline-block; margin-top:8px; background:#0A0A0A; color:#F5F1EA; font-family:'DM Sans',sans-serif; font-weight:700; font-size:15px; padding:12px 22px; text-decoration:none; width:fit-content;\">Ask about the follow-up setup<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n\n\n\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    viewingIndex: 0, completed: {}, gatePassed: false, gateSkipped: false, courseStartTs: null, loaded: false,\n    session: null, authEmailInput: '', magicLinkSent: false,\n    chatOpen: false, chatMessages: [], chatInput: '', isLoading: false, visitor: null,\n    lang: 'nl', translatedLessons: null, translating: false\n  };\n  courseId = 'ai-etsy';\n\n  _lessons = [\n    { kicker: 'Overview', title: 'What this course gets you', isPro: false, blocks: [\n      { type: 'p', text: 'For makers and small shop owners on Etsy who want listings that get found and sound like them, without spending an evening on every product.' },\n      { type: 'list', items: [\n        'Listing titles and tags built around what buyers actually search for',\n        'Product descriptions in your own voice, not generic AI-speak',\n        'Optionally: a thank-you and review request email sent automatically after every order',\n        'More time making, less time typing'\n      ]},\n      { type: 'p', text: '25 minutes to read through. After that, 10 minutes per new listing using Steps 1-2. Free for Starter; the optional automation runs under $5/month.' }\n    ]},\n    { kicker: 'Step 0 · 10 minutes, one-time', title: 'Foundation: set up your tools', isPro: false, blocks: [\n      { type: 'checklist', items: [\n        'An AI chat tool you already use — ChatGPT, Claude, Gemini or another, your pick',\n        'OpenAI API key + free n8n account (only for automation)',\n        'Etsy shop access (to connect the automation, Pro only)'\n      ]},\n      { type: 'list', items: [\n        'Pick whichever AI chat tool you already use or want to try — ChatGPT, Claude, Gemini and others all work here. This course isn’t tied to one brand.',\n        \"Pick your 3 best-selling or most-loved listings as reference for tone.\",\n        \"Write one sentence describing your shop's overall style — you'll reuse it often.\"\n      ]}\n    ]},\n    { kicker: 'Step 1 · 5 minutes per listing', title: 'Titles & tags buyers actually search for', isPro: false, blocks: [\n      { type: 'prompt', text: 'Suggest an Etsy listing title and 13 tags for [product description]. Style: [your shop\\u2019s style, e.g. handmade, rustic, minimalist]. Prioritize terms buyers would actually search, not vague adjectives.' },\n      { type: 'list', items: [\n        'Describe the product plainly \\u2014 material, use, style.',\n        'Ask for 3 title variations and pick the one that reads most natural.',\n        \"Check tags aren't duplicating words already in the title \\u2014 Etsy rewards variety.\"\n      ]}\n    ]},\n    { kicker: 'Step 2 · 5-10 minutes per listing', title: 'Descriptions in your own voice', isPro: false, blocks: [\n      { type: 'prompt', text: \"Write an Etsy product description for [product], in the voice of someone [describe your shop's tone, e.g. warm and personal / clean and minimal]. Include materials, size, and care instructions. Avoid generic phrases like 'perfect gift' unless it's genuinely one.\" },\n      { type: 'list', items: [\n        'Paste your one-sentence shop style description in every prompt for consistency.',\n        \"Read the draft aloud \\u2014 if it doesn't sound like you, ask for a rewrite 'more casual' or 'more polished'.\",\n        'Reuse your favorite structure as a template for future listings.'\n      ]}\n    ]},\n    { kicker: 'Step 3 · 15-20 minutes, one-time setup', title: 'Automatic thank-you + review request', isPro: true, blocks: [\n      { type: 'p', text: 'The moment an order comes in, a warm thank-you email drafts itself, with a review request timed a week later \\u2014 you just approve and send.' },\n      { type: 'checklist', items: ['File: 01_etsy_followup.json', 'Etsy shop connected via API or order export', 'Free n8n account'] },\n      { type: 'list', items: [\n        'Import 01_etsy_followup.json into n8n.',\n        'Connect your Etsy shop or order notification email.',\n        'Activate and test with a recent order.',\n        'Every draft appears in your inbox for review before sending \\u2014 nothing sends automatically.'\n      ]},\n      { type: 'prompt', text: \"System prompt used: 'Write a warm, personal thank-you message for an Etsy order of [product]. Max 80 words. End with an invitation to reach out with questions.'\" }\n    ]},\n    { kicker: 'Bonus', title: 'More Etsy uses worth trying', isPro: false, blocks: [\n      { type: 'list', items: [\n        'Ask AI for 5 seasonal listing ideas based on your current catalog',\n        'Draft a restock announcement for social media',\n        'Turn a customer photo caption into a review request message'\n      ]}\n    ]},\n    { kicker: 'FAQ', title: 'Frequently asked questions', isPro: false, blocks: [\n      { type: 'qa', q: 'Will AI-written listings sound generic?', a: 'Only if you skip the style sentence \\u2014 paste it into every prompt and ask for rewrites until it sounds like you.' },\n      { type: 'qa', q: 'Do I need to know how to code?', a: 'No. Steps 1-2 are copy-paste prompts. Step 3 is an import-and-connect n8n template.' },\n      { type: 'qa', q: \"Can this help with SEO, not just wording?\", a: 'Yes \\u2014 the tag prompt in Step 1 is built specifically around search terms buyers use.' },\n      { type: 'qa', q: 'What if a thank-you draft has the wrong details?', a: 'Every draft sits in your inbox for review first \\u2014 nothing sends automatically.' },\n      { type: 'qa', q: 'How much does the Pro automation cost?', a: 'Typically under $5/month in OpenAI API usage for a normal order volume.' }\n    ]},\n    { kicker: 'Wrap-up', title: 'Copy-paste checklist', isPro: false, blocks: [\n      { type: 'checklist', items: [\n        'Pick your AI tool (ChatGPT, Claude, Gemini — whichever you use or prefer)',\n        'Write your one-sentence shop style description',\n        'Draft a title + tags for one listing',\n        'Draft a description for one listing',\n        '(Pro) Import 01_etsy_followup.json, connect shop, test',\n        'Try one Bonus idea this week'\n      ]}\n    ]}\n  ];\n\n  get lessons() { return this.state.translatedLessons || this._lessons; }\n  langName() { return ({ nl:'Dutch', en:'English', de:'German', fr:'French', es:'Spanish' })[this.state.lang] || 'Dutch'; }\n  buildLangOptions() {\n    const langs = [['nl','NL'],['en','EN'],['de','DE'],['fr','FR'],['es','ES']];\n    return langs.map(([code,label]) => ({\n      label,\n      onSelect: () => this.setLang(code),\n      style: `background:${this.state.lang===code?'#0A0A0A':'transparent'}; color:${this.state.lang===code?'#F5F1EA':'#737373'}; font-size:11px; font-weight:600; padding:4px 8px; border:1px solid ${this.state.lang===code?'#0A0A0A':'#E5E0D8'}; cursor:pointer;`\n    }));\n  }\n  async setLang(code) {\n    if (code === this.state.lang) return;\n    try { localStorage.setItem('ba_lang', code); } catch (e) {}\n    if (code === 'nl') { this.setState({ lang: code, translatedLessons: null }); return; }\n    const cacheKey = `ba_lessons_${this.courseId}_${code}`;\n    let cached = null;\n    try { cached = JSON.parse(localStorage.getItem(cacheKey) || 'null'); } catch (e) {}\n    if (cached) { this.setState({ lang: code, translatedLessons: cached }); return; }\n    this.setState({ lang: code, translating: true });\n    try {\n      const names = { en: 'English', de: 'German', fr: 'French', es: 'Spanish' };\n      const prompt = `Translate every human-readable string value in this JSON array into ${names[code]}. Keep all object keys, array order, and any [placeholder] tokens exactly the same. Keep a practical, friendly, second-person tone. Return ONLY valid JSON, no markdown fences, no commentary.\\n\\n${JSON.stringify(this._lessons)}`;\n      const raw = await window.claude.complete({ messages: [{ role: 'user', content: prompt }], max_tokens: 4000 });\n      const cleaned = raw.trim().replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();\n      const translated = JSON.parse(cleaned);\n      try { localStorage.setItem(cacheKey, JSON.stringify(translated)); } catch (e) {}\n      this.setState({ translatedLessons: translated, translating: false });\n    } catch (e) { this.setState({ translating: false }); }\n  }\n\n  async componentDidMount() {\n    try { const stored = localStorage.getItem('ba_lang'); if (stored && stored !== 'nl') this.setLang(stored); } catch (e) {}\n    try {\n      this.ally = await import('./ally-chat.js');\n      const visitor = this.ally.loadVisitor();\n      const opening = visitor\n        ? `Hoi ${visitor.name} — welkom terug. Waar waren we, of wat wil je vandaag oppakken?`\n        : 'Hoi, ik ben Sailly. Vraag me gerust iets over deze les, of waar je verder kan in het menu.';\n      this.setState({ visitor, chatMessages: [{ from: 'sailly', text: opening }] });\n    } catch (e) {}\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem('sy-course-ai-etsy') || '{}'); } catch (e) {}\n    const courseStartTs = saved.courseStartTs || Date.now();\n    this.setState({\n      viewingIndex: saved.viewingIndex || 0,\n      completed: saved.completed || {},\n      gatePassed: !!saved.gatePassed,\n      gateSkipped: !!saved.gateSkipped,\n      courseStartTs,\n      loaded: true\n    }, () => this.persistLocal());\n\n    try {\n      this.sb = await import('./supabase-client.js');\n      if (this.sb.isConfigured()) {\n        const session = await this.sb.getSession();\n        if (session) await this.handleAuth(session);\n        this.sb.onAuthChange((session) => { if (session) this.handleAuth(session); });\n        this.sb.logEvent(this.courseId, 'course_started', {});\n      }\n    } catch (e) {}\n  }\n\n  async handleAuth(session) {\n    this.setState({ session, magicLinkSent: false });\n    const remote = await this.sb.loadProgress(this.courseId);\n    if (remote) {\n      this.setState({\n        completed: remote.completed || {},\n        gatePassed: !!remote.gate_passed,\n        gateSkipped: !!remote.gate_skipped,\n        courseStartTs: remote.course_start_ts || this.state.courseStartTs,\n        viewingIndex: remote.viewing_index || 0\n      }, () => this.persist());\n    } else {\n      this.persist();\n    }\n  }\n\n  persistLocal() {\n    localStorage.setItem('sy-course-ai-etsy', JSON.stringify({\n      viewingIndex: this.state.viewingIndex,\n      completed: this.state.completed,\n      gatePassed: this.state.gatePassed,\n      gateSkipped: this.state.gateSkipped,\n      courseStartTs: this.state.courseStartTs\n    }));\n  }\n\n  persist() {\n    this.persistLocal();\n    if (this.sb && this.state.session) {\n      this.sb.saveProgress(this.courseId, {\n        completed: this.state.completed,\n        gate_passed: this.state.gatePassed,\n        gate_skipped: this.state.gateSkipped,\n        course_start_ts: this.state.courseStartTs,\n        viewing_index: this.state.viewingIndex\n      });\n    }\n  }\n\n  onAuthEmailChange(e) { this.setState({ authEmailInput: e.target.value }); }\n  toggleChat() { this.setState({ chatOpen: !this.state.chatOpen }); }\n  onChatInputChange(e) { this.setState({ chatInput: e.target.value }); }\n  onChatKeyDown(e) { if (e.key === 'Enter') this.onSendChat(); }\n\n  async onSendChat() {\n    const text = this.state.chatInput.trim();\n    if (!text || this.state.isLoading || !this.ally) return;\n    const history = [...this.state.chatMessages, { from: 'user', text }];\n    this.setState({ chatMessages: history, chatInput: '', isLoading: true });\n    const lesson = this.lessons[this.state.viewingIndex];\n    const context = `\\nThe visitor is currently on lesson \"${lesson.title}\" (${this.state.viewingIndex + 1} of ${this.lessons.length}) of the AI for Your Etsy Shop course. Respond in ${this.langName()}.`;\n    try {\n      const raw = await this.ally.sendMessage(history, this.ally.BASE_SYSTEM_PROMPT + context);\n      const { text: afterSave, visitor } = this.ally.extractSaveTag(raw);\n      const { text: clean, lang: detectedLang } = this.ally.extractLangTag(afterSave);\n      if (visitor) { this.ally.saveVisitor(visitor.name, visitor.code); this.setState({ visitor }); }\n      if (detectedLang && detectedLang !== this.state.lang) { this.setLang(detectedLang); }\n      this.setState({ chatMessages: [...history, { from: 'sailly', text: clean }], isLoading: false });\n      if (this.sb) { this.sb.logChatMessage(this.courseId, 'user', text); this.sb.logChatMessage(this.courseId, 'sailly', clean); }\n    } catch (e) {\n      this.setState({ chatMessages: [...history, { from: 'sailly', text: 'Sorry, er ging iets mis — probeer het zo nog eens.' }], isLoading: false });\n    }\n  }\n\n  async onSendMagicLink() {\n    if (!this.sb || !this.state.authEmailInput) return;\n    await this.sb.sendMagicLink(this.state.authEmailInput);\n    this.setState({ magicLinkSent: true });\n  }\n\n  async onSignOut() {\n    if (this.sb) await this.sb.signOut();\n    this.setState({ session: null });\n  }\n\n  isUnlocked(i) { return i === 0 || !!this.state.completed[i - 1]; }\n\n  selectLesson(i) {\n    if (!this.isUnlocked(i)) return;\n    this.setState({ viewingIndex: i }, () => this.persist());\n  }\n\n  completeLesson() {\n    const i = this.state.viewingIndex;\n    const completed = { ...this.state.completed, [i]: true };\n    const next = Math.min(i + 1, this.lessons.length - 1);\n    const isLast = i === this.lessons.length - 1;\n    this.setState({ completed, viewingIndex: isLast ? i : next }, () => {\n      this.persist();\n      if (this.sb) this.sb.logEvent(this.courseId, isLast ? 'course_completed' : 'lesson_completed', { lesson: i });\n    });\n  }\n\n  passGate() {\n    this.setState({ gatePassed: true }, () => {\n      this.persist();\n      if (this.sb) this.sb.logEvent(this.courseId, 'gate_passed', {});\n    });\n  }\n\n  skipToBonus() {\n    this.setState({ gateSkipped: true, gatePassed: true, viewingIndex: 5 }, () => this.persist());\n  }\n\n  renderVals() {\n    const { viewingIndex, completed, gatePassed, courseStartTs } = this.state;\n    const total = this.lessons.length;\n    const completedCount = Object.keys(completed).length;\n    const percent = Math.round((completedCount / total) * 100);\n    const elapsedMin = courseStartTs ? Math.max(1, Math.round((Date.now() - courseStartTs) / 60000)) : 0;\n\n    const sidebarLessons = this.lessons.map((l, i) => {\n      const locked = !this.isUnlocked(i);\n      const done = !!completed[i];\n      const active = i === viewingIndex;\n      return {\n        title: l.title,\n        isPro: l.isPro,\n        locked,\n        done,\n        showNumber: !done && !locked,\n        numberLabel: String(i + 1),\n        rowStyle: `display:flex;align-items:center;gap:10px;text-align:left;padding:10px 10px;font-size:14px;background:${active ? '#f2ead0' : 'transparent'};opacity:${locked ? 0.45 : 1};cursor:${locked ? 'default' : 'pointer'};`,\n        titleStyle: `line-height:1.3;font-weight:${active ? 700 : 500};`,\n        onSelect: () => this.selectLesson(i)\n      };\n    });\n\n    const activeLessonRaw = this.lessons[viewingIndex];\n    const showGate = viewingIndex === 4 && !gatePassed;\n    const showLesson = !showGate;\n    const activeBlocks = showGate ? [] : (activeLessonRaw.blocks || []).map(b => ({\n      ...b,\n      isP: b.type === 'p',\n      isList: b.type === 'list',\n      isChecklist: b.type === 'checklist',\n      isPrompt: b.type === 'prompt',\n      isQa: b.type === 'qa'\n    }));\n\n    const isLast = viewingIndex === total - 1;\n    const alreadyDone = !!completed[viewingIndex];\n    const showUpsell = isLast && alreadyDone;\n    const isFast = elapsedMin < 10;\n\n    const setback = this.state.gateSkipped;\n    let saillyStage, saillyLabel;\n    if (percent >= 100) { saillyStage = 'triumphant'; saillyLabel = 'Sailly in volle bloei'; }\n    else if (percent >= 60) { saillyStage = 'bloom'; saillyLabel = 'Sailly slaat haar vleugels uit'; }\n    else if (percent >= 25) { saillyStage = 'awkward'; saillyLabel = 'Sailly, nog wat onhandig'; }\n    else if (completedCount > 0) { saillyStage = 'baby'; saillyLabel = 'Baby Sailly, net uit het ei'; }\n    else { saillyStage = 'egg'; saillyLabel = 'Sailly, nog in het ei'; }\n    if (setback) saillyLabel = 'Sailly verloor een veertje — niks aan de hand';\n\n    const saillyIconSrc = 'assets/parrot-triumphant.png';\n    const companionImgs = {\n      egg: 'assets/parrot-egg.png', baby: 'assets/parrot-baby.png', awkward: 'assets/parrot-awkward.png', bloom: 'assets/parrot-bloom.png', triumphant: 'assets/parrot-triumphant.png' };\n    const companionSizes = { egg: 110, baby: 130, awkward: 175, bloom: 215, triumphant: 250 };\n    const companionIconSrc = setback ? companionImgs.awkward : companionImgs[saillyStage];\n    const companionSize = companionSizes[saillyStage];\n\n    const session = this.state.session;\n    return {\n      authLoggedOut: !session,\n      authLoggedIn: !!session,\n      magicLinkSent: this.state.magicLinkSent,\n      magicLinkNotSent: !this.state.magicLinkSent,\n      authEmail: session ? session.user.email : this.state.authEmailInput,\n      onAuthEmailChange: (e) => this.onAuthEmailChange(e),\n      onSendMagicLink: () => this.onSendMagicLink(),\n      onSignOut: () => this.onSignOut(),\n      langOptions: this.buildLangOptions(), translating: this.state.translating,\n      completedCount, totalLessons: total,\n      progressBarStyle: `height:100%;background:#C9A227;width:${percent}%;`,\n      saillyIconSrc,\n      chatOpen: this.state.chatOpen,\n      toggleChat: () => this.toggleChat(),\n      chatHeaderTitle: this.state.visitor ? `Hoi ${this.state.visitor.name} — welkom terug` : 'Sailly',\n      showReturningPill: !!this.state.visitor && !this.state.chatOpen,\n      returningPillText: this.state.visitor ? `Hoi ${this.state.visitor.name} — Built Again gids.` : '',\n      chatInput: this.state.chatInput,\n      onChatInputChange: (e) => this.onChatInputChange(e),\n      onChatKeyDown: (e) => this.onChatKeyDown(e),\n      onSendChat: () => this.onSendChat(),\n      isLoading: this.state.isLoading,\n      chatMessages: this.state.chatMessages.map(m => ({\n        text: m.text,\n        bubbleStyle: m.from === 'sailly'\n          ? 'background:#f2ead0;color:#0A0A0A;font-size:13.5px;line-height:1.5;padding:8px 12px;align-self:flex-start;max-width:85%;'\n          : 'background:#0A0A0A;color:#F5F1EA;font-size:13.5px;line-height:1.5;padding:8px 12px;align-self:flex-end;max-width:85%;'\n      })),\n      companionIconSrc, companionSize,\n      saillyLabel,\n      sidebarLessons,\n      showGate,\n      gateStats: `${completedCount} of ${total} lessons done, ${elapsedMin} minute${elapsedMin === 1 ? '' : 's'} in.`,\n      gateMessage: isFast\n        ? \"You're moving through this quickly — a good sign the manual prompts already feel easy. That's usually the moment the automation starts to make sense, if you'd like to try it.\"\n        : \"You've worked through the manual, Starter-tier steps at your own pace. Step 3 is there if you'd like to automate the last one — no pressure either way.\",\n      passGate: () => this.passGate(),\n      skipToBonus: () => this.skipToBonus(),\n      showLesson,\n      activeLesson: activeLessonRaw,\n      activeBlocks,\n      nextLabel: isLast ? (alreadyDone ? 'Reviewed' : 'Finish course') : 'Mark complete & continue',\n      completeLesson: () => this.completeLesson(),\n      showUpsell,\n      upsellHeadline: isFast ? \"You moved through this quickly.\" : \"Nice work — you've reached the end.\",\n      elapsedMin\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fdiv><\u002Fx-dc><\u002Fbody><\u002Fhtml>"
